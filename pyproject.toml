[project]
name = "rtiow-python"
version = "0.1.0"
description = "A small path tracer written in Python, inspired by Ray Tracing in One Weekend."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
raytracer = "raytracer.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "RET", # flake8-return
]
ignore = []

